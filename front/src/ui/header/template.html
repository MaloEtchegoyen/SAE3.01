<header class="sticky top-0 z-30 bg-brand">
  <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-6 py-3.5 md:px-10">

      <img data-ref="logo" alt="Café Feuillette" class="h-10 w-auto md:h-11">
    </a>

    <!-- Le routeur pose aria-current="page" sur le lien de la page affichée. -->
    <nav class="flex items-center gap-6 text-[0.95rem] font-normal text-white md:gap-10">
      <a href="/" data-link class="transition-opacity hover:opacity-80 aria-[current=page]:font-medium">
        Catalogue
      </a>
      <a href="/compte" data-link class="transition-opacity hover:opacity-80 aria-[current=page]:font-medium">
        Mon compte
      </a>
      <button type="button" data-action="logout" class="cursor-pointer transition-opacity hover:opacity-80">
        Se déconnecter
      </button>
      <a href="/panier" data-link class="flex items-center gap-2.5 transition-opacity hover:opacity-80 aria-[current=page]:font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 11-1 9" />
          <path d="m19 11-4-7" />
          <path d="M2 11h20" />
          <path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4" />
          <path d="m4.5 15.5 15 0" />
          <path d="m5 11 4-7" />
          <path d="m9 11 1 9" />
        </svg>
        <span data-ref="compteur-panier">Panier ({{nb}})</span>
      </a>
    </nav>
  </div>
</header>

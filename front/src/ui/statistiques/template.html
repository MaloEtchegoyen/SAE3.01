<section class="mb-6">
  <div class="bg-brand text-white rounded-2xl p-6 sm:p-7 w-full sm:max-w-sm flex flex-col justify-between shadow-xs">
    <div>
      <h2 class="text-title-sm font-bold tracking-tight text-white">Nombre de produits</h2>
      <div class="text-6xl font-bold my-4 text-white leading-none tracking-tight">
        {{totalProduits}}
      </div>
      <p class="text-white/90 text-body-sm font-medium mb-6">
        {{totalCategories}} catégories
      </p>
    </div>

    <div class="flex flex-wrap gap-2">
      <a
        href="/admin/produits"
        data-link
        class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-input hover:bg-input-hover text-white text-sm font-medium transition-colors shadow-xs"
      >
        Gérer les produits
      </a>
      <a
        href="/admin/categories"
        data-link
        class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm font-medium transition-colors shadow-xs"
      >
        Gérer les catégories
      </a>
    </div>
  </div>
</section>

<header class="flex w-full flex-col justify-between border-b md:border-b-0 md:border-r border-zinc-200 bg-brand p-4 sm:p-6 md:h-full md:w-64 dark:border-zinc-800 shadow-xs">
  <div class="flex flex-col gap-4 md:gap-6">
    <div class="flex items-center justify-between">
      <h1 class="text-title-md sm:text-title-lg md:text-title-xl font-bold text-white">Admin</h1>

      <!-- Contrôles rapides visibles sur mobile uniquement -->
      <div class="flex items-center gap-2 md:hidden">
        <button
          type="button"
          data-action="toggle-menu-admin"
          aria-label="Ouvrir le menu d'administration"
          aria-expanded="false"
          class="flex h-9 w-9 items-center justify-center rounded-md border border-white/30 text-white transition-colors hover:bg-input-hover cursor-pointer"
        >
          <svg data-ref="icone-burger-admin" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg data-ref="icone-fermer-admin" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Navigation Admin (repliable sur mobile, permanente sur desktop) -->
    <nav data-ref="nav-admin" class="hidden md:flex flex-col w-full gap-2 text-body-sm font-medium">
      <a href="/admin" data-link class="rounded-lg bg-strong px-4 py-2.5 text-white transition-colors hover:bg-input-hover aria-[current=page]:bg-input aria-[current=page]:text-white aria-[current=page]:hover:bg-input-hover">
        Accueil
      </a>
      <a href="/admin/produits" data-link class="rounded-lg bg-strong px-4 py-2.5 text-white transition-colors hover:bg-input-hover aria-[current=page]:bg-input aria-[current=page]:text-white aria-[current=page]:hover:bg-input-hover">
        Produits
      </a>
      <a href="/admin/categories" data-link class="rounded-lg bg-strong px-4 py-2.5 text-white transition-colors hover:bg-input-hover aria-[current=page]:bg-input aria-[current=page]:text-white aria-[current=page]:hover:bg-input-hover">
        Catégories
      </a>
      <a href="/admin/commandes" data-link class="rounded-lg bg-strong px-4 py-2.5 text-white transition-colors hover:bg-input-hover aria-[current=page]:bg-input aria-[current=page]:text-white aria-[current=page]:hover:bg-input-hover">
        Commandes
      </a>
      <a href="/" data-link class="mt-2 rounded-md border border-white/20 px-3 py-2 text-center text-caption text-white/90 transition-colors hover:bg-white/10">
        &larr; Retour à la boutique
      </a>
    </nav>
  </div>
</header>

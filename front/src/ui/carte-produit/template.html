<article data-id="{{id}}" data-stock="{{code_stock}}" class="group relative flex h-100 w-full flex-col justify-end overflow-hidden rounded-3xl text-default border border-border">
  <a
    href="/produit/{{slug}}"
    data-link
    data-ref="image"
    aria-label="{{nom}}"
    class="absolute inset-0 h-full w-full overflow-hidden"
  >
    <img
      src="{{image_url}}"
      alt="{{nom}}"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
    />
  </a>
  <div class="pointer-events-none absolute inset-0 bg-linear-to-t from-black/85 via-black/40 to-black/20 transition-opacity duration-300 group-hover:opacity-90"></div>
  <div class="w-full z-10 flex justify-between p-4">
    <h3 class="mb-2 text-lg font-bold leading-snug tracking-tight drop-shadow-sm line-clamp-2">
      <a href="/produit/{{slug}}" data-link class="hover:underline transition-opacity">
        {{nom}}
      </a>
    </h3>
      <span class="text-xl tracking-tight drop-shadow-sm">
        {{prix}}
      </span>
  </div>
    <div class="relative justify-between z-10 flex px-4 pb-4">
      <a
        href="/produit/{{slug}}"
        data-link
        class="text-center px-5 p-2 rounded-md bg-input hover:bg-input-hover text-white text-sm font-medium transition cursor-pointer"
      >
        Plus de détails
      </a>
    <span
      data-ref="badge-stock"
      data-stock="{{code_stock}}"
      class="badge-stock inline-flex items-center border border-border rounded-md px-5 text-xs font-semibold tracking-wide shadow-xs"
    >
      {{etat_stock}}
    </span>
  </div>
</article>

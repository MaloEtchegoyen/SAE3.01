<tr class="block md:table-row rounded-2xl border border-white/20 bg-brand p-4 shadow-xs md:rounded-none md:border-0 md:p-0 transition-colors hover:bg-white/10" data-ligne-commande="{{id}}">
  <td class="flex items-center justify-between py-1.5 md:table-cell md:w-12 md:px-3 md:py-3 sm:px-4 sm:py-4 md:text-center border-b border-white/10 pb-2 mb-1 md:border-0 md:pb-0 md:mb-0">
    <span class="text-caption font-semibold text-white/70 md:hidden">Sélectionner</span>
    <input
      type="checkbox"
      data-action="selectionner-ligne"
      value="{{id}}"
      aria-label="Sélectionner la commande {{numero_commande}}"
      class="h-4 w-4 rounded-sm border-white/60 bg-transparent text-sand-600 cursor-pointer focus:ring-0"
    />
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-3 sm:px-4 sm:py-4 font-mono font-medium">
    <span class="text-caption font-semibold text-white/70 md:hidden font-sans">Commande</span>
    <span>{{numero_commande}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-3 sm:px-4 sm:py-4">
    <span class="text-caption font-semibold text-white/70 md:hidden">Date</span>
    <span>{{date_formatee}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-3 sm:px-4 sm:py-4">
    <span class="text-caption font-semibold text-white/70 md:hidden">Client</span>
    <span>{{utilisateur_login}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-3 sm:px-4 sm:py-4">
    <span class="text-caption font-semibold text-white/70 md:hidden">Statut</span>
    <div class="relative inline-block">
      <select
        data-action="changer-statut"
        class="appearance-none rounded-lg border border-white/60 bg-transparent px-2.5 py-1 sm:px-3 sm:py-1.5 pr-7 sm:pr-8 text-caption font-medium text-white cursor-pointer transition-colors hover:bg-white/10 focus:bg-strong focus:outline-hidden"
      >
        <option value="en cours" class="bg-strong text-white">En cours</option>
        <option value="disponible" class="bg-strong text-white">Disponible</option>
        <option value="retirée" class="bg-strong text-white">Retirée</option>
        <option value="annulée" class="bg-strong text-white">Annulée</option>
      </select>
      <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2 text-white/80">
        <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 20 20">
          <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
        </svg>
      </span>
    </div>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-3 sm:px-4 sm:py-4 font-medium">
    <span class="text-caption font-semibold text-white/70 md:hidden">Total</span>
    <span>{{total_formate}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-3 sm:px-4 sm:py-4 pt-2 mt-1 border-t border-white/10 md:border-0 md:pt-0 md:mt-0">
    <span class="text-caption font-semibold text-white/70 md:hidden">Action</span>
    <button
      type="button"
      data-action="detail"
      class="font-medium text-white underline hover:opacity-80 cursor-pointer"
    >
      Détails
    </button>
  </td>
</tr>

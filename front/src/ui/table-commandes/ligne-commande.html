<tr class="transition-colors hover:bg-white/10" data-ligne-commande="{{id}}">
  <td class="w-12 px-4 py-4 text-center">
    <input
      type="checkbox"
      data-action="selectionner-ligne"
      value="{{id}}"
      aria-label="Sélectionner la commande {{numero_commande}}"
      class="h-4 w-4 rounded-sm border-white/60 bg-transparent text-sand-600 cursor-pointer focus:ring-0"
    />
  </td>
  <td class="px-4 py-4 font-mono font-medium whitespace-nowrap">
    {{numero_commande}}
  </td>
  <td class="px-4 py-4 whitespace-nowrap">
    {{date_formatee}}
  </td>
  <td class="px-4 py-4">
    {{utilisateur_login}}
  </td>
  <td class="px-4 py-4 whitespace-nowrap">
    <div class="relative inline-block">
      <select
        data-action="changer-statut"
        class="appearance-none rounded-lg border border-white/60 bg-transparent px-3 py-1.5 pr-8 text-xs font-medium text-white cursor-pointer transition-colors hover:bg-white/10 focus:bg-strong focus:outline-hidden"
      >
        <option value="en cours" class="bg-strong text-white">En cours</option>
        <option value="disponible" class="bg-strong text-white">Disponible</option>
        <option value="retirée" class="bg-strong text-white">Retirée</option>
        <option value="annulée" class="bg-strong text-white">Annulée</option>
      </select>
      <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2 text-white/80">
        <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 20 20">
          <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
        </svg>
      </span>
    </div>
  </td>
  <td class="px-4 py-4 whitespace-nowrap font-medium">
    {{total_formate}}
  </td>
  <td class="px-4 py-4 whitespace-nowrap">
    <button
      type="button"
      data-action="detail"
      class="font-medium text-white hover:underline cursor-pointer"
    >
      Détails
    </button>
  </td>
</tr>

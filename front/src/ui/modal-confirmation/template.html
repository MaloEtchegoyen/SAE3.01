<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-xs animate-in fade-in duration-200" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
  <div class="bg-accent w-full max-w-lg rounded-3xl p-8 text-white shadow-2xl">
    <h3 id="modal-titre" class="text-2xl sm:text-3xl font-bold text-white tracking-tight mb-4">
      {{titre}}
    </h3>

    <p class="text-base sm:text-lg text-white/95 leading-relaxed mb-6">
      {{message}}
    </p>

    <slot name="corps"></slot>

    <div class="flex justify-end items-center gap-4 pt-2">
      <button
        type="button"
        data-action="annuler"
        class="inline-flex items-center justify-center rounded-xl bg-brand hover:opacity-90 px-7 py-3 text-sm sm:text-base font-medium text-white transition-opacity shadow-xs cursor-pointer"
      >
        {{boutonAnnuler}}
      </button>
      <button
        type="button"
        data-action="confirmer"
        class="inline-flex items-center justify-center rounded-xl bg-input hover:bg-input-hover px-7 py-3 text-sm sm:text-base font-medium text-white transition-colors shadow-xs cursor-pointer"
      >
        {{boutonConfirmer}}
      </button>
    </div>
  </div>
</div>

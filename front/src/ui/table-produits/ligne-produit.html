<tr class="bg-brand">
  <td class="px-6 py-4 font-normal text-white">
    {{nom}}
  </td>
  <td class="px-6 py-4 font-normal text-white">
    {{categorie}}
  </td>
  <td class="px-6 py-4 font-normal text-white">
    {{prix}}
  </td>
  <td class="px-6 py-4 font-normal text-white">
    {{stock}}
  </td>
  <td class="px-6 py-4 font-normal text-white">
    {{seuil_alerte}}
  </td>
  <td class="flex gap-8 px-6 py-4 font-normal text-white">
    <button type="button" data-action="modifier" data-id="{{id}}" class="cursor-pointer text-white transition-opacity hover:opacity-80">
      Modifier
    </button>
    <button type="button" data-action="supprimer" data-id="{{id}}" class="cursor-pointer text-white transition-opacity hover:opacity-80">
      Supprimer
    </button>
  </td>
</tr>

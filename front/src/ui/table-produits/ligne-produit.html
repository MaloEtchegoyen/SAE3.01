<tr class="block md:table-row rounded-xl border border-white/20 bg-brand p-4 shadow-xs md:rounded-none md:border-0 md:p-0 transition-colors hover:bg-white/5">
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 font-medium text-white border-b border-white/10 pb-2 mb-1 md:border-0 md:pb-0 md:mb-0">
    <span class="text-caption font-semibold text-white/70 md:hidden">Produit</span>
    <span class="font-semibold md:font-medium text-right md:text-left">{{nom}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 md:hidden">Catégorie</span>
    <span>{{categorie}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 md:hidden">Prix</span>
    <span class="font-medium">{{prix}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 md:hidden">Stock</span>
    <span>{{stock}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 md:hidden">Seuil alerte</span>
    <span>{{seuil_alerte}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 font-normal text-white pt-3 mt-1 border-t border-white/10 md:border-0 md:pt-0 md:mt-0">
    <span class="text-caption font-semibold text-white/70 md:hidden">Action</span>
    <div class="flex items-center gap-4 sm:gap-6">
      <button type="button" data-action="modifier" data-id="{{id}}" class="cursor-pointer text-white underline hover:opacity-80">
        Modifier
      </button>
      <button type="button" data-action="supprimer" data-id="{{id}}" class="cursor-pointer text-red-300 hover:text-red-100 underline">
        Supprimer
      </button>
    </div>
  </td>
</tr>

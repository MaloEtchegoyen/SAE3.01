<tr class="block lg:table-row rounded-xl border border-white/20 bg-brand p-4 shadow-xs lg:rounded-none lg:border-0 lg:p-0 transition-colors lg:hover:bg-white/5">
  <td class="flex items-center justify-between py-1.5 border-b border-white/10 pb-2 mb-1 lg:table-cell lg:px-4 lg:py-4 lg:border-0 lg:pb-0 lg:mb-0 font-medium text-white">
    <span class="text-caption font-semibold text-white/70 lg:hidden">Produit</span>
    <span class="font-semibold lg:font-medium text-right lg:text-left">{{nom}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 lg:table-cell lg:px-4 lg:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 lg:hidden">Catégorie</span>
    <span>{{categorie}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 lg:table-cell lg:px-4 lg:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 lg:hidden">Prix</span>
    <span class="font-medium">{{prix}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 lg:table-cell lg:px-4 lg:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 lg:hidden">Stock</span>
    <span>{{stock}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 lg:table-cell lg:px-4 lg:py-4 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 lg:hidden">Seuil alerte</span>
    <span>{{seuil_alerte}}</span>
  </td>
  <td class="flex items-center justify-between py-1.5 pt-3 mt-1 border-t border-white/10 lg:table-cell lg:px-4 lg:py-4 lg:border-0 lg:pt-0 lg:mt-0 font-normal text-white">
    <span class="text-caption font-semibold text-white/70 lg:hidden">Action</span>
    <div class="flex items-center gap-4 sm:gap-6">
      <button type="button" data-action="modifier" data-id="{{id}}" class="cursor-pointer text-white underline hover:opacity-80">
        Modifier
      </button>
      <button type="button" data-action="supprimer" data-id="{{id}}" class="cursor-pointer text-red-300 hover:text-red-100 underline">
        Supprimer
      </button>
    </div>
  </td>
</tr>

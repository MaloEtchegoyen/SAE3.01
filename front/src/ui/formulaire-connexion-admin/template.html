<section class="rounded-2xl bg-accent p-6 sm:p-8 shadow-sm">
  <h2 class="mb-6 text-2xl sm:text-title-md font-bold text-white tracking-tight">Connexion administrateur</h2>

  <form class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-sm font-medium text-white">
      Email administrateur
      <input
        name="login"
        type="text"
        autocomplete="username"
        value="{{login}}"
        placeholder="exemple@gmail.com"
        class="h-12 w-full rounded-lg border-none bg-input px-4 text-sm font-normal text-white placeholder-white/70 outline-none transition-colors hover:bg-input-hover focus:ring-2 focus:ring-white/40"
      />
    </label>

    <label class="flex flex-col gap-2 text-sm font-medium text-white">
      Mot de passe
      <input
        name="mdp"
        type="password"
        autocomplete="current-password"
        placeholder="•••••"
        class="h-12 w-full rounded-lg border-none bg-input px-4 text-sm font-normal text-white placeholder-white/70 outline-none transition-colors hover:bg-input-hover focus:ring-2 focus:ring-white/40"
      />
    </label>

    <slot name="message"></slot>

    <button
      type="submit"
      class="mt-1 h-12 w-full rounded-lg bg-input px-4 text-sm font-medium text-white transition-opacity hover:opacity-90 cursor-pointer"
    >
      Accéder au back-office
    </button>
  </form>
</section>

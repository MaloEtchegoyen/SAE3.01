<div class="flex items-center justify-between rounded-xl border border-neutral-200 bg-white p-4 shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
  <div class="flex items-center gap-4 min-w-0">
    <img
      src="{{image_url}}"
      alt="{{nom_produit}}"
      data-img-produit
      class="h-16 w-16 shrink-0 rounded-xl object-cover bg-neutral-100 dark:bg-zinc-800"
    />
    <div class="min-w-0">
      <h4 class="font-bold text-neutral-900 dark:text-neutral-100 truncate">
        {{nom_produit}}
      </h4>
      <p data-zone-variante class="text-caption text-neutral-500 dark:text-neutral-400 mt-0.5 hidden">
        {{nom_variante}}
      </p>
      <p class="text-caption text-neutral-500 dark:text-neutral-400 mt-0.5">
        {{prix_unitaire}} / unité
      </p>
    </div>
  </div>

  <div class="flex items-center gap-6 shrink-0 text-right">
    <span class="text-body-sm font-bold text-neutral-900 dark:text-neutral-100">
      &times; {{quantite}}
    </span>
    <span class="text-body font-bold text-neutral-900 dark:text-neutral-100 whitespace-nowrap">
      {{total_ligne}}
    </span>
  </div>
</div>

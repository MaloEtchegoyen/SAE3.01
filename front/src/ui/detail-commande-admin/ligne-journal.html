<tr class="transition-colors hover:bg-zinc-50/50 dark:hover:bg-zinc-800/30">
  <td class="px-3 py-2 text-zinc-500 whitespace-nowrap dark:text-zinc-400">
    {{date_formatee}}
  </td>
  <td class="px-3 py-2 font-medium text-zinc-800 dark:text-zinc-200">
    {{admin_login}}
  </td>
  <td class="px-3 py-2">
    <span class="inline-flex items-center gap-1.5 font-medium">
      <span class="rounded bg-zinc-100 px-1.5 py-0.5 text-zinc-700 dark:bg-zinc-800 dark:text-zinc-300">{{ancien_statut}}</span>
      <span class="text-zinc-400">&rarr;</span>
      <span class="rounded bg-amber-100 px-1.5 py-0.5 font-semibold text-amber-800 dark:bg-amber-900/50 dark:text-amber-200">{{nouveau_statut}}</span>
    </span>
  </td>
  <td class="px-3 py-2 text-zinc-600 dark:text-zinc-300">
    {{commentaire}}
  </td>
</tr>

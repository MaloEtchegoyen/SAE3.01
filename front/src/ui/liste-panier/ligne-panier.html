<article
  data-cle="{{cle}}"
  class="flex flex-col gap-4 rounded-2xl border border-border bg-white p-4 md:p-6 shadow-xs text-content-primary"
>
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 w-full">
    <div class="flex items-center gap-4 w-full sm:w-auto">
      <img
        src="{{image_url}}"
        alt="{{nom}}"
        class="h-20 w-20 shrink-0 rounded-xl border border-border object-cover bg-neutral-100"
      />
      <div class="flex flex-col">
        <h3 class="text-body md:text-body-lg font-bold leading-tight text-content-primary">
          {{nom}}
        </h3>
        <span class="text-caption text-content-muted mt-0.5 {{classe_option}}">
          {{option}}
        </span>
        <span class="text-caption md:text-body-sm text-content-secondary mt-1">
          {{prix_unitaire}} / unité
        </span>
        <div class="flex items-center gap-3 mt-1.5">
          <button
            type="button"
            data-action="modifier-options"
            class="text-caption text-brand hover:underline text-left cursor-pointer transition font-medium {{classe_btn_modifier}}"
          >
            Modifier les options
          </button>
          <button
            type="button"
            data-action="supprimer"
            class="text-caption text-content-muted hover:text-red-600 underline text-left cursor-pointer transition w-fit"
          >
            Supprimer
          </button>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto">
      <!-- Sélecteur de quantité - 1 + -->
      <div class="flex items-center rounded-xl border border-border bg-subtle p-1 shadow-2xs">
        <button
          type="button"
          data-action="diminuer"
          aria-label="Diminuer la quantité"
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-default text-content-primary transition hover:bg-neutral-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer"
        >
          -
        </button>
        <span
          data-ref="valeur-quantite"
          class="w-10 text-center text-body-sm font-semibold text-content-primary"
        >
          {{quantite}}
        </span>
        <button
          type="button"
          data-action="augmenter"
          aria-label="Augmenter la quantité"
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-default text-content-primary transition hover:bg-neutral-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer"
        >
          +
        </button>
      </div>

      <!-- Total de la ligne -->
      <span class="w-24 text-right text-body md:text-body-lg font-bold text-content-primary">
        {{total_ligne}}
      </span>
    </div>
  </div>

  <!-- Panneau d'édition in situ des options (OPT-a, OPT-b, OPT-c) -->
  <div
    data-ref="panneau-edition"
    class="mt-2 pt-4 border-t border-border flex flex-col gap-4 bg-neutral-50/60 -mx-4 -mb-4 md:-mx-6 md:-mb-6 p-4 md:p-6 rounded-b-2xl {{classe_panneau_edition}}"
  >
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-body-sm font-bold text-content-primary">
          Personnaliser cet article
        </span>
        <span data-ref="statut-stock-edition" class="text-caption font-semibold"></span>
      </div>
      <span data-ref="nouveau-prix-edition" class="text-body-sm font-bold text-brand"></span>
    </div>

    <!-- Groupes d'options injectés dynamiquement -->
    <div data-ref="groupes-options-edition" class="flex flex-col gap-3"></div>

    <!-- Actions du panneau in situ -->
    <div class="flex items-center justify-end gap-3 pt-2">
      <button
        type="button"
        data-action="annuler-edition"
        class="rounded-xl border border-border bg-white px-4 py-2 text-body-sm font-medium text-content-secondary hover:bg-neutral-100 cursor-pointer transition shadow-2xs"
      >
        Annuler
      </button>
      <button
        type="button"
        data-action="valider-edition"
        class="rounded-xl bg-brand px-4 py-2 text-body-sm font-semibold text-white hover:bg-brand-hover cursor-pointer transition shadow-xs disabled:opacity-40 disabled:pointer-events-none"
      >
        Enregistrer les modifications
      </button>
    </div>
  </div>
</article>

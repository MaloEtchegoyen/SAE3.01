<section class="mb-6 rounded-lg bg-accent text-default border border-border p-6 shadow-xs dark:border-zinc-800">
  <div class="mb-5">
    <h2 class="text-base font-semibold tracking-tight">Créer un compte</h2>
    <p class="mt-1 text-sm text-content-secondary dark:text-zinc-300">
      Renseignez votre email et un mot de passe pour finaliser vos achats rapidement.
    </p>
  </div>

  <form class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-sm font-medium">
      Adresse email
      <input
        name="email"
        type="email"
        required
        autocomplete="email"
        placeholder="exemple@domaine.fr"
        value="{{email}}"
        class="h-9 border-none rounded-md border border-border bg-input px-3 font-normal transition-colors hover:border-input-hover"
      />
    </label>

    <label class="flex flex-col gap-2 text-sm font-medium">
      Mot de passe (6 caractères minimum)
      <input
        name="mdp"
        type="password"
        required
        minlength="6"
        autocomplete="new-password"
        placeholder="••••••••"
        class="h-9 border-none rounded-md border border-border bg-input px-3 font-normal transition-colors hover:border-border"
      />
    </label>

    <label class="flex flex-col gap-2 text-sm font-medium">
      Confirmer le mot de passe
      <input
        name="confirmation"
        type="password"
        required
        minlength="6"
        autocomplete="new-password"
        placeholder="••••••••"
        class="h-9 border-none rounded-md border border-border bg-input px-3 font-normal transition-colors hover:border-border"
      />
    </label>

    <div class="mt-2 flex flex-col gap-3">
      <div class="flex flex-wrap items-center gap-3">
        <button
          type="submit"
          class="h-9 rounded-md bg-input px-4 text-sm font-medium text-zinc-50 transition-opacity hover:bg-input-hover dark:bg-zinc-50 dark:text-zinc-900 cursor-pointer"
        >
          Créer mon compte
        </button>
      </div>

      <div class="text-sm text-content-secondary dark:text-zinc-300">
        Vous possédez déjà un compte ?
        <button
          type="button"
          data-action="basculer-connexion"
          class="font-medium underline underline-offset-4 hover:opacity-80 cursor-pointer ml-1 text-default dark:text-zinc-100"
        >
          Se connecter
        </button>
      </div>
    </div>
  </form>
</section>

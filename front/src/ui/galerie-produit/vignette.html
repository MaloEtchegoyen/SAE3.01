<button
  type="button"
  aria-label="{{aria_label}}"
  data-actif="{{est_actif}}"
  class="relative h-25 w-full flex-1 overflow-hidden rounded-2xl border transition-all duration-200 cursor-pointer data-[actif=true]:border-brand data-[actif=true]:ring-2 data-[actif=true]:ring-brand data-[actif=true]:scale-102 data-[actif=true]:shadow-sm data-[actif=false]:border-border data-[actif=false]:hover:border-brand/60 data-[actif=false]:opacity-70 data-[actif=false]:hover:opacity-100"
>
  <img src="{{url_image}}" alt="{{alt_image}}" class="h-full w-full object-cover" />
</button>

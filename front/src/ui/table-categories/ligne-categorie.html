<tr class="bg-brand transition-colors hover:bg-white/5">
  <td class="px-6 py-4 font-medium text-white">
    <div class="flex items-center gap-2">
      <span class="font-semibold">{{nom}}</span>
    </div>
  </td>
  <td class="px-6 py-4 text-white/80 max-w-md">
    <p class="line-clamp-2 text-xs sm:text-sm text-white/80">
      {{description}}
    </p>
  </td>
  <td class="px-6 py-4 text-white">
    <span class="inline-flex items-center rounded-full bg-white/10 px-2.5 py-0.5 text-xs font-medium text-white">
      {{nombre_produits}} produit(s)
    </span>
  </td>
  <td class="px-6 py-4 text-right">
    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        data-action="modifier"
        data-id="{{id}}"
        class="inline-flex items-center rounded-md bg-white/10 px-3 py-1.5 text-xs font-medium text-white transition-colors hover:bg-white/20 cursor-pointer"
      >
        Modifier
      </button>
      <button
        type="button"
        data-action="supprimer"
        data-id="{{id}}"
        class="inline-flex items-center rounded-md bg-red-600/80 px-3 py-1.5 text-xs font-medium text-white transition-colors hover:bg-red-600 cursor-pointer"
      >
        Supprimer
      </button>
    </div>
  </td>
</tr>

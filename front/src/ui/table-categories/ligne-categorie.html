<tr class="block md:table-row rounded-xl border border-white/20 bg-brand p-4 shadow-xs md:rounded-none md:border-0 md:p-0 transition-colors md:hover:bg-white/5">
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 font-medium text-white border-b border-white/10 pb-2 mb-1 md:border-0 md:pb-0 md:mb-0">
    <span class="text-caption font-semibold text-white/70 md:hidden">Nom de la catégorie</span>
    <div class="flex items-center gap-2">
      <span class="font-semibold md:font-medium text-right md:text-left">{{nom}}</span>
    </div>
  </td>
  <td class="flex items-start justify-between gap-4 py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 text-white/80 md:max-w-md">
    <span class="text-caption font-semibold text-white/70 md:hidden shrink-0">Description</span>
    <p class="text-right md:text-left line-clamp-2 text-caption sm:text-body-sm text-white/80">
      {{description}}
    </p>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 text-white">
    <span class="text-caption font-semibold text-white/70 md:hidden">Produits rattachés</span>
    <span class="inline-flex items-center rounded-full bg-white/10 px-2.5 py-0.5 text-xs font-medium text-white">
      {{nombre_produits}} produit(s)
    </span>
  </td>
  <td class="flex items-center justify-between py-1.5 md:table-cell md:px-3 md:py-4 sm:px-6 sm:py-4 text-right pt-3 mt-1 border-t border-white/10 md:border-0 md:pt-0 md:mt-0">
    <span class="text-caption font-semibold text-white/70 md:hidden">Actions</span>
    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        data-action="modifier"
        data-id="{{id}}"
        class="inline-flex items-center rounded-md bg-white/10 px-3 py-1.5 text-xs font-medium text-white transition-colors hover:bg-white/20 cursor-pointer"
      >
        Modifier
      </button>
      <button
        type="button"
        data-action="supprimer"
        data-id="{{id}}"
        class="inline-flex items-center rounded-md bg-red-600/80 px-3 py-1.5 text-xs font-medium text-white transition-colors hover:bg-red-600 cursor-pointer"
      >
        Supprimer
      </button>
    </div>
  </td>
</tr>

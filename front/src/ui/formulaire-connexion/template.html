<section class="mb-6 rounded-lg bg-accent text-default border border-border p-6 shadow-xs dark:border-zinc-800">
  <div class="mb-5">
    <h2 class="text-body font-semibold tracking-tight">Connexion</h2>
    <p class="mt-1 text-body-sm text-content-secondary dark:text-zinc-300">
      Connectez-vous pour retrouver vos commandes et finaliser votre panier.
    </p>
  </div>

  <form class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-body-sm font-medium">
      Adresse email ou identifiant
      <input
        name="login"
        type="text"
        required
        autocomplete="username"
        value="{{login}}"
        placeholder="votre-email@domaine.fr"
        class="h-9 border-none rounded-md border border-border bg-input px-3 font-normal transition-colors hover:border-input-hover"
      />
    </label>

    <label class="flex flex-col gap-2 text-body-sm font-medium">
      Mot de passe
      <input
        name="mdp"
        type="password"
        required
        autocomplete="current-password"
        placeholder="••••••••"
        class="h-9 border-none rounded-md border border-border bg-input px-3 font-normal transition-colors hover:border-border"
      />
    </label>

    <div class="mt-2 flex flex-col gap-3">
      <div class="flex flex-wrap items-center gap-3">
        <button
          type="submit"
          class="h-9 rounded-md bg-input px-4 text-body-sm font-medium text-zinc-50 transition-opacity hover:bg-input-hover dark:bg-zinc-50 dark:text-zinc-900 cursor-pointer"
        >
          Se connecter
        </button>

        <button
          type="button"
          data-action="deconnexion"
          class="hidden h-9 rounded-md border border-border px-4 text-body-sm font-medium transition-colors hover:bg-input-hover cursor-pointer"
        >
          Se déconnecter
        </button>
      </div>

      <div class="text-body-sm text-content-secondary dark:text-zinc-300">
        Pas encore de compte ?
        <button
          type="button"
          data-action="basculer-inscription"
          class="font-medium underline underline-offset-4 hover:opacity-80 cursor-pointer ml-1 text-default dark:text-zinc-100"
        >
          Créer un compte
        </button>
      </div>
    </div>
  </form>
</section>

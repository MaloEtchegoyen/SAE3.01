<section class="mb-8 rounded-xl bg-strong p-6 text-white shadow-md">
  <div class="mb-6 flex items-center justify-between border-b border-white/20 pb-4">
    <h2 data-ref="titre" class="text-xl font-bold tracking-tight text-white">Nouveau produit</h2>
    <span class="text-xs text-white/70">Les champs marqués d'un * sont obligatoires</span>
  </div>

  <form class="space-y-5" novalidate>
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
      <!-- Nom du produit -->
      <label class="flex flex-col gap-1.5 text-sm font-medium text-white">
        Nom du produit *
        <input
          name="nom"
          type="text"
          required
          placeholder="ex. Brioche feuilletée"
          class="h-10 rounded-lg border border-white/20 bg-white/10 px-3.5 text-sm text-white placeholder-white/50 transition-colors focus:border-white focus:bg-white/20 focus:outline-none"
        />
      </label>

      <!-- Catégorie -->
      <label class="flex flex-col gap-1.5 text-sm font-medium text-white">
        Catégorie
        <select
          name="category_id"
          class="h-10 rounded-lg border border-white/20 bg-strong px-3.5 text-sm text-white transition-colors focus:border-white focus:outline-none"
        >
          <option value="">Sans catégorie</option>
        </select>
      </label>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-3">
      <!-- Prix -->
      <label class="flex flex-col gap-1.5 text-sm font-medium text-white">
        Prix (€) *
        <input
          name="prix"
          type="number"
          step="0.01"
          min="0"
          required
          placeholder="ex. 2.80"
          class="h-10 rounded-lg border border-white/20 bg-white/10 px-3.5 text-sm text-white placeholder-white/50 transition-colors focus:border-white focus:bg-white/20 focus:outline-none"
        />
      </label>

      <!-- Stock initial -->
      <label class="flex flex-col gap-1.5 text-sm font-medium text-white">
        Stock initial
        <input
          name="stock"
          type="number"
          step="1"
          min="0"
          value="0"
          placeholder="0"
          class="h-10 rounded-lg border border-white/20 bg-white/10 px-3.5 text-sm text-white placeholder-white/50 transition-colors focus:border-white focus:bg-white/20 focus:outline-none"
        />
      </label>

      <!-- Seuil d'alerte -->
      <label class="flex flex-col gap-1.5 text-sm font-medium text-white">
        Seuil d'alerte stock
        <input
          name="seuil_alerte"
          type="number"
          step="1"
          min="0"
          value="5"
          placeholder="5"
          class="h-10 rounded-lg border border-white/20 bg-white/10 px-3.5 text-sm text-white placeholder-white/50 transition-colors focus:border-white focus:bg-white/20 focus:outline-none"
        />
      </label>
    </div>

    <!-- Description -->
    <label class="flex flex-col gap-1.5 text-sm font-medium text-white">
      Description
      <textarea
        name="description"
        rows="3"
        placeholder="Courte description de ce produit gourmand..."
        class="rounded-lg border border-white/20 bg-white/10 p-3 text-sm text-white placeholder-white/50 transition-colors focus:border-white focus:bg-white/20 focus:outline-none"
      ></textarea>
    </label>

    <!-- Images du produit (Téléversement & Prévisualisation jusqu'à 4 images) -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <span class="block text-sm font-medium text-white">Images du produit</span>
        <span data-ref="compteur-images" class="text-xs text-white/70">0 / 4 image(s)</span>
      </div>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <!-- Zone de sélection / téléversement -->
        <label
          data-ref="zone-depot"
          class="flex flex-col items-center justify-center rounded-lg border-2 border-dashed border-white/25 bg-white/5 p-5 text-center transition-colors hover:border-white/50 hover:bg-white/10 cursor-pointer min-h-40"
        >
          <input
            name="images"
            type="file"
            accept="image/*"
            multiple
            class="sr-only"
          />
          <svg class="h-8 w-8 text-white/70 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span data-ref="texte-depot" class="text-sm font-medium text-white">Cliquez ou glissez jusqu'à 4 images</span>
          <span class="text-xs text-white/60 mt-1">PNG, JPG, WEBP (Max 5 Mo chacune)</span>
        </label>

        <!-- Zone de prévisualisation -->
        <div
          data-ref="zone-previsualisation"
          class="flex flex-col justify-center rounded-lg border border-white/20 bg-white/5 p-3 min-h-40"
        >
          <p data-ref="message-vide" class="text-center text-xs text-white/50 py-8">
            Aucune image sélectionnée pour le moment.
          </p>
          <div data-ref="grille-images" class="hidden grid-cols-2 gap-2.5">
            <!-- Les vignettes seront injectées dynamiquement -->
          </div>
        </div>
      </div>
    </div>

    <!-- Boutons d'action -->
    <div class="flex flex-wrap items-center justify-end gap-3 pt-3">
      <button
        type="button"
        data-action="annuler"
        class="inline-flex cursor-pointer items-center justify-center rounded-lg border border-white/30 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-white/10"
      >
        Annuler
      </button>
      <button
        type="submit"
        data-ref="bouton-soumettre"
        class="inline-flex cursor-pointer items-center justify-center rounded-lg bg-input px-6 py-2.5 text-sm font-medium text-white shadow-xs transition-colors hover:bg-input-hover"
      >
        Ajouter le produit
      </button>
    </div>
  </form>
</section>

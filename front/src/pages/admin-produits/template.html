<section class="mx-auto max-w-5xl px-6 pt-10 pb-16">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <h1 class="text-3xl font-bold tracking-tight text-sand-600">Gestion des produits</h1>

    <button
      type="button"
      data-action="toggle-formulaire"
      class="inline-flex cursor-pointer items-center justify-center rounded-lg bg-input px-5 py-2.5 text-sm font-medium text-white shadow-xs transition-colors hover:bg-input-hover"
    >
      Ajouter un produit
    </button>
  </div>

  <div class="mb-6">
    <slot name="message"></slot>
  </div>

  <slot name="formulaire"></slot>

  <slot name="produits"></slot>

  <slot name="modale"></slot>
</section>
